# Postgres só para desenvolvimento local. Em produção, DATABASE_URL aponta para o banco gerenciado.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: newsletter
      POSTGRES_PASSWORD: newsletter
      POSTGRES_DB: newsletter_suporte
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
